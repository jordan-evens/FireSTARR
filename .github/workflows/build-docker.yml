name: build-docker

# NOTE:
#   This is a mess because the cmake process relies on having .git mounted,
#   and also captures the build time, so docker sees any push as modifying
#   things, and it makes a new image.
#   This caches the built image with the commit hash, and then adds tags to it if
#   another push is the same hash.
#   Tried pushing image to another cache package, but then the digest changes.
#   Tried just caching the image reference but actions/cache doesn't work between branches.
#   Tried pulling, tagging, and pushing in same registry, but doesn't work for multiplatform.
on:
  push:
    paths-ignore:
      - '.github/workflows/cmake-test.yml'
      - '.github/workflows/docker-cleanup.yml'
  pull_request:
  workflow_dispatch:

# queue runs so that images get built & cache gets used instead of building in parallel
# Use case() so that building published version is the same concurrency, but things only
# going to cache don't block each other
concurrency:
  group: ${{ github.workflow }}-${{ case( startsWith(github.ref, 'refs/tags/v') || contains('["main", "dev", "unstable"]', github.ref_name), 'published', github.sha ) }}
  queue: max

env:
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

jobs:
  # split this way so hopefully the cache is there between normal and minimal
  build-docker-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # no point in more than base image supports
        platform: [amd64, arm64, ppc64le, riscv64, s390x, 386, arm/v5, arm/v7]
    env:
      REGISTRY: 'ghcr.io'
      # since package-name is 'cache' if this isn't tagged or one of main/dev/unstable, we can run the whole process to test still
      package-name: ${{ case( startsWith(github.ref, 'refs/tags/v') || contains('["main", "dev", "unstable"]', github.ref_name), 'firestarr', 'cache' ) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true

      - name: Login to container registry
        id: login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare environment
        shell: bash
        run: |
          PLATFORM=${{ matrix.platform }}
          REPO=${{ env.REGISTRY }}/${GITHUB_REPOSITORY@L}
          REF_NAME=${{ github.ref_name }}
          echo "PLATFORM_PAIR=${PLATFORM//\//}" >> $GITHUB_ENV
          echo "CACHE_REF=${REF_NAME//\//}" >> $GITHUB_ENV
          echo "PACKAGE=${REPO}/firestarr" >> $GITHUB_ENV
          echo "REGISTRY_CACHE=${REPO}/cache" >> $GITHUB_ENV

      # treat changing .env as if it were tagged even if that hasn't happened yet
      - name: Check tags
        id: check
        run: |
          . ./.env
          cached=${REGISTRY_CACHE}:${{ github.sha }}
          cached_minimal=${cached}-minimal
          ENV_TAG=v${VERSION}
          VERSION_HASH=$(git log -n1 --pretty=%H -- .env)
          FULL_HASH=$(git rev-parse --verify HEAD)
          is_tagged=false
          if [[ "${VERSION_HASH}" == "${FULL_HASH}" ]]; then
            is_tagged=true
            echo "tagged-hash=${FULL_HASH}" >> $GITHUB_OUTPUT
            echo "tag=${VERSION}" >> $GITHUB_OUTPUT
          fi
          echo "CACHED=${cached}" >> $GITHUB_ENV
          echo "CACHED_MINIMAL=${cached_minimal}" >> $GITHUB_ENV
          echo "IS_TAGGED=${is_tagged}" >> $GITHUB_ENV

      # unsure how minimal could exist without other
      - name: Check existing
        id: check-missing
        run: |
          echo "env.CACHED: ${{ env.CACHED }}"
          echo "env.CACHED_MINIMAL: ${{ env.CACHED_MINIMAL }}"
          MISSING=$( \
            ( \
              ( \
                docker manifest inspect ${{ env.CACHED }} \
                && docker manifest inspect ${{ env.CACHED_MINIMAL }} \
              ) > /dev/null 2>&1 \
              && echo "false" \
            ) || echo "true")
          echo "MISSING: ${MISSING}"
          echo "MISSING=${MISSING}" >> $GITHUB_ENV
          echo "image-missing=${MISSING}" >> $GITHUB_OUTPUT

      - name: Pre-build files
        run: |
          find "${{ github.workspace }}"

      - name: Remove reference files
        run: |
          rm -rfv "${{ github.workspace }}/test/output/reference"

      - name: After remove test files
        run: |
          find "${{ github.workspace }}"

      - uses: ./.github/actions/docker-build-image
        id: build-firestarr
        with:
          target: firestarr
          registry: ${{ env.REGISTRY }}
          package-name: ${{ env.package-name }}
          platform: ${{ matrix.platform }}
          suffix:
          push: ${{ github.event_name != 'pull_request' }}
          image-missing: ${{ 'true' == steps.check-missing.outputs.image-missing }}

      - name: Run docker test
        run: |
          rm -rf ./test/output/reference
          docker image ls firestarr
          IMAGE=$(docker image ls firestarr | tail -n1 | cut -d' ' -f1)
          docker run --rm -it -v./settings.ini:/appl/firestarr/settings.ini -v./test:/appl/firestarr/test $IMAGE test/output/reference 2024-06-03 58.81228184403946 -122.9117103995713 01:00 --ffmc 89.9 --dmc 59.5 --dc 450.9 --apcp_prev 0 -v --wx ./test/input/10N_50651/firestarr_10N_50651_wx.csv --output_date_offsets [1,2,3] --tz -5 --raster-root ./test/input/10N_50651/ --perim ./test/input/10N_50651/10N_50651.tif -i --ascii
          rm ./test/output/reference/*.ini
          rm ./test/output/reference/*.log
          git diff test/output/reference && echo "Reference check worked"

      - name: Post-build files
        run: |
          find "${{ github.workspace }}"

      - name: Upload test outputs artifact
        uses: actions/upload-artifact@v7
        with:
          name: 'test-outputs-${{ env.PLATFORM_PAIR }}'
          path: test/output/reference
          archive: true
          compression-level: 9
          retention-days: 30

      - uses: ./.github/actions/docker-build-image
        id: build-firestarr-minimal
        with:
          target: firestarr-minimal
          registry: ${{ env.REGISTRY }}
          package-name: ${{ env.package-name }}
          platform: ${{ matrix.platform }}
          suffix: -minimal
          push: ${{ github.event_name != 'pull_request' }}
          image-missing: ${{ 'true' == steps.check-missing.outputs.image-missing }}

    outputs:
      package: ${{ steps.build-firestarr.outputs.package }}
      cached: ${{ steps.build-firestarr.outputs.cached }}
      cached-minimal: ${{ steps.build-firestarr-minimal.outputs.cached }}
      image-missing: ${{ 'true' == steps.check-missing.outputs.image-missing }}
      is-tagged: ${{ env.IS_TAGGED }}

  merge-firestarr:
    needs: [build-docker-image]
    if: ${{ github.event_name != 'pull_request' }}
    uses: ./.github/workflows/docker-merge-image.yml
    with:
      target: firestarr
      package: ${{ needs.build-docker-image.outputs.package }}
      cached: ${{ needs.build-docker-image.outputs.cached }}
      image-missing: ${{ 'true' == needs.build-docker-image.outputs.image-missing }}
      suffix:
      flavor: |
        latest=${{ case ( startsWith(github.ref, 'refs/tags/v'), 'auto', 'false' ) }}
        prefix=
        suffix=
      tags: |
        type=ref,event=pr
        type=ref,prefix=,suffix=,event=branch,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
        type=ref,prefix=,suffix=-latest,event=branch,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
        type=semver,pattern={{version}},prefix=,suffix=,enable=${{ needs.build-docker-image.outputs.is-tagged }}
        type=semver,pattern={{major}}.{{minor}},prefix=,suffix=,enable=${{ needs.build-docker-image.outputs.is-tagged }}

  merge-firestarr-minimal:
    needs: [build-docker-image]
    if: ${{ github.event_name != 'pull_request' }}
    uses: ./.github/workflows/docker-merge-image.yml
    with:
      target: firestarr-minimal
      package: ${{ needs.build-docker-image.outputs.package }}
      cached: ${{ needs.build-docker-image.outputs.cached-minimal }}
      image-missing: ${{ 'true' == needs.build-docker-image.outputs.image-missing }}
      suffix: -minimal
      flavor: |
        latest=false
        prefix=
        suffix=-minimal
      tags: |
        type=ref,event=pr,prefix=,suffix=-minimal
        type=ref,prefix=,suffix=-minimal,event=branch,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
        type=ref,prefix=,suffix=-minimal-latest,event=branch,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
        type=semver,pattern={{version}},prefix=,suffix=-minimal,enable=${{ needs.build-docker-image.outputs.is-tagged }}
        type=semver,pattern={{major}}.{{minor}},prefix=,suffix=-minimal,enable=${{ needs.build-docker-image.outputs.is-tagged }}
        type=raw,value=minimal,prefix=,suffix=,enable=${{ needs.build-docker-image.outputs.is-tagged }}
        type=raw,value=minimal-latest,prefix=,suffix=,enable=${{ needs.build-docker-image.outputs.is-tagged }}
